<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contributor Report - Login</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f8fa;
            color: #1f2328;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 48px 40px;
        }
        .logo { max-width: min(600px, 100%); height: auto; }
        h1 { margin: 16px 0 32px; font-size: 22px; font-weight: 600; color: #1b1f23; text-align: center; }
        .github-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background-color: #24292f;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(27, 31, 36, 0.15);
        }
        .github-button:hover { background-color: #32383f; }
        .github-button:active { background-color: #24292f; }
        .github-button svg { fill: #ffffff; }
        .error { max-width: 600px; margin: 0 0 16px; color: #d1242f; text-align: center; }
        .back { margin-top: 24px; font-size: 14px; color: #0969da; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/img/octopus-deploy-logo.png" alt="Octopus Deploy">
        <h1>Contributor Report (Octopus Employees only)</h1>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <a class="github-button" href="/login/github">
            <svg height="20" width="20" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0c-4.42 0-8 3.58-8 8 0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 2.13-.01 2.4 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            Login with GitHub
        </a>
        <a class="back" href="/">Back to reports</a>
    </div>
</body>
</html>
